name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      run: |
        shellcheck -S error hooks/*.sh
        jq empty .claude-plugin/*.json .cursor-plugin/*.json hooks/hooks.json
